kind = "mobile"
previewPath = "/mobile/"
title = "CPNS Tryout Mobile"
description = "Aplikasi mobile companion untuk platform CPNS Tryout. Peserta bisa login dengan Google OAuth, mengakses daftar tryout, mengerjakan soal latihan, menyelesaikan sesi tryout, dan melihat hasil beserta review jawaban — semuanya dari smartphone."
version = "1.0.0"
id = "artifacts/cpns-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 21974

[services.development]
run = "pnpm --filter @workspace/cpns-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cpns-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cpns-mobile", "run", "serve" ]

[services.env]
PORT = "21974"
BASE_PATH = "/mobile/"
